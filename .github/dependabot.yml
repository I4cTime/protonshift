version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 9 * * mon#1,mon#2"
    open-pull-requests-limit: 10
    labels: ["dependencies", "security"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 9 * * mon#1,mon#2"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
