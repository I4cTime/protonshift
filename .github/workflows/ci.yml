name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

# Cancel superseded runs on the same ref (repeated pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # qmllint and pytest both run headless; neither needs a real display, but
    # QT_QPA_PLATFORM=offscreen covers any future test that instantiates a
    # QGuiApplication (e.g. testing a controller end-to-end) without needing
    # xvfb on the runner.
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check protonshift

      - name: QML lint
        shell: bash
        run: |
          shopt -s globstar nullglob
          pyside6-qmllint -I protonshift/qml protonshift/qml/**/*.qml

      - name: Test
        run: pytest
