name: Build & Release

on:
  push:
    # The tag push is the single release trigger: action-gh-release below
    # creates the GitHub release for the tag if none exists yet.
    tags: ["v*"]
  # Manual dry-run: builds the bundle and uploads it as a workflow artifact
  # without creating or touching any release.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ID: io.github.i4ctime.protonshift
      RUNTIME_VERSION: "24.08"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Resolve the tag the bundle is named after: the pushed tag on tag runs,
      # or "v<pyproject version>-dev" on workflow_dispatch dry-runs (where no
      # tag exists).
      - name: Resolve bundle tag
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            TAG="$REF_NAME"
          else
            VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
            TAG="v${VERSION}-dev"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Version guard (tag must match pyproject.toml)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag ${TAG} does not match pyproject.toml version ${VERSION}. Bump pyproject.toml (or retag) so they agree, then push the tag again."
            exit 1
          fi

      # Raw flatpak/flatpak-builder CLI rather than a marketplace action
      # (e.g. flatpak-github-actions/flatpak-builder): that action is built
      # around Flathub-style offline manifests, and its exact input surface
      # for our network-enabled *local* manifest
      # (flatpak/io.github.i4ctime.protonshift.yml — see flatpak/README.md,
      # "works today" variant) isn't worth guessing at.
      #
      # CI uses the *host* flatpak-builder (apt), not org.flatpak.Builder:
      # `flatpak run org.flatpak.Builder` executes flatpak-builder inside its
      # own sandbox, where the runner user's --user installation is not
      # visible — the build fails with "Unable to find sdk
      # org.freedesktop.Sdk version 24.08" even though the SDK is installed.
      # Local dev still uses org.flatpak.Builder per flatpak/README.md.
      - name: Install flatpak + flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      # Runtimes + SDK + builder are ~2 GB of downloads; cache them keyed on
      # the manifest (which pins the runtime version).
      - name: Cache flatpak runtimes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/flatpak
          key: flatpak-${{ runner.os }}-${{ hashFiles('flatpak/io.github.i4ctime.protonshift.yml') }}

      - name: Add Flathub remote
        run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      # Preinstalling Platform + Sdk (rather than relying solely on
      # --install-deps-from below) keeps the actions/cache path warm.
      - name: Install runtime + SDK
        run: |
          flatpak install -y --user --noninteractive flathub \
            "org.freedesktop.Platform//${RUNTIME_VERSION}" \
            "org.freedesktop.Sdk//${RUNTIME_VERSION}"

      - name: Build (into a local repo)
        run: |
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=repo build-dir flatpak/io.github.i4ctime.protonshift.yml

      - name: Bundle
        run: |
          flatpak build-bundle repo "${APP_ID}-${TAG}.flatpak" "${APP_ID}"

      # Tag runs: create the release for this tag (if it doesn't exist yet)
      # and attach the bundle. This is the only release-creating path.
      - name: Upload bundle to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ${{ env.APP_ID }}-${{ env.TAG }}.flatpak

      # Dispatch dry-runs: prove the build without publishing anything.
      - name: Upload bundle artifact (dry-run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APP_ID }}-${{ env.TAG }}
          path: ${{ env.APP_ID }}-${{ env.TAG }}.flatpak
          retention-days: 7
