name: Build & Release

on:
  release:
    # Fires when a release is published (including from draft); avoids duplicate runs with `created`
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v5
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: electron/pnpm-lock.yaml

      - name: Install dependencies
        env:
          # @heroui-pro/react has a postinstall step that fetches the real dist
          # from the HeroUI Pro registry. Without this token it stops at the
          # skeleton package and the renderer build cannot resolve `@heroui-pro/react`.
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Build AppImage
        run: pnpm run dist

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/*.AppImage
